[tox]
envlist = py313
requires = setuptools >= 58.0.0
           pip >= 21.0.0
           virtualenv >= 20.9.0

[testenv]
description = byte-compile only; the hwtest/ pytest suite needs WLAN Pi Pro hardware
commands =
    python -m compileall -q hwtest

[testenv:black]
basepython = python3
skip_install = true
deps =
    autoflake
    black
    isort
commands =
    autoflake --remove-all-unused-imports --recursive --remove-unused-variables --in-place hwtest --exclude=__init__.py
    black hwtest
    isort hwtest --profile black

[testenv:format]
basepython = python3
skip_install = true
deps =
    {[testenv:black]deps}
commands =
    {[testenv:black]commands}
