[tox]
envlist = py313, lint, formatcheck
requires = setuptools >= 58.0.0
           pip >= 21.0.0
           virtualenv >= 20.9.0

[testenv]
description = byte-compile only; the hwtest/ pytest suite needs WLAN Pi Pro hardware
commands =
    python -m compileall -q hwtest

[testenv:lint]
description = run ruff check
skip_install = true
deps = ruff==0.17.1
commands =
    ruff check hwtest

[testenv:formatcheck]
description = check formatting with ruff
skip_install = true
deps = ruff==0.17.1
commands =
    ruff format --check hwtest

[testenv:format]
description = format with ruff and apply safe lint fixes
skip_install = true
deps = ruff==0.17.1
commands =
    ruff format hwtest
    ruff check --fix hwtest
