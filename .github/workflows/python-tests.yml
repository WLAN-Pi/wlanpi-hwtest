name: Run Python Tests

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE
  pull_request:
    paths-ignore:
      - '**/*.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE

permissions:
  contents: read
  actions: read

jobs:
  tox:
    name: tox
    runs-on: 'ubuntu-24.04-arm'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install tox
        run: python -m pip install tox

      - name: Run tox
        run: tox

  discord-workflow-status:
    if: ${{ always() && github.repository_owner == 'WLAN-Pi' && ! github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    name: Post Workflow Status to Discord
    needs:
      - tox
    uses: WLAN-Pi/gh-workflows/.github/workflows/discord-workflow-status.yml@main
    permissions:
      actions: read
      contents: read
    with:
      parent_run_id: ${{ github.run_id }}
    secrets: inherit
